name: opengym

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    environment:
      - PORT=${PORT:-3000}
      - DATA_DIR=/app/data
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - RP_ID=${RP_ID}
      - ORIGIN=${ORIGIN}
      - ALLOWED_PRIVATE_IPS=${ALLOWED_PRIVATE_IPS}
      - INVITE_ONLY=${INVITE_ONLY:-0}
      - ALLOW_GUEST=${ALLOW_GUEST:-1}
    volumes:
      - opengym_data:/app/data
      - opengym_coach:/app/coach-auth

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      - RESOLVER=${RESOLVER:-127.0.0.11}
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      - BASE_PATH=${BASE_PATH:-}
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-112m}
      - MCP_BACKEND=${MCP_BACKEND:-mcp}
      - MCP_PORT=${MCP_PORT:-3100}

volumes:
  opengym_data:
  opengym_coach:
